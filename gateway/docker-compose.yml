# ============================================================================
# STRATUM-CORE — gateway
# Repository: stratum-core
# Isolation by design, not by discipline.
# ============================================================================
#
# Component ......... gateway
# Function .......... Access layer. Termination of inbound traffic from
#                     the Internet (multi-tenant/multi-organization tunnels)
#                     and distribution to the Stratum DMZ.
# Artifact .......... docker-compose.yml
# Revision .......... 1.2.0
# Status ............ Production
#
# ============================================================================

x-defaults: &defaults
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-cloudflared-base: &cloudflared-base
  <<: *defaults
  image: cloudflare/cloudflared:latest
  init: true
  user: "65534:65534"
  networks:
    - gateway_internal
    - stratum_dmz
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777,uid=65534,gid=65534
    - /home/nonroot/.cloudflared:size=8m,mode=0700,uid=65534,gid=65534
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 50
  mem_limit: 128m
  memswap_limit: 128m
  stop_signal: SIGTERM
  stop_grace_period: 15s
  depends_on:
    npm:
      condition: service_healthy

name: stratum-gateway

services:

  # --------------------------------------------------------------------------
  # Reverse Proxy & Certificate Manager (Nginx Proxy Manager)
  # --------------------------------------------------------------------------
  npm:
    <<: *defaults
    image: jc21/nginx-proxy-manager:latest
    container_name: stratum-gateway-npm

    ports:
      - "127.0.0.1:81:81"

    environment:
      TZ: ${TZ:-America/Bogota}
      DISABLE_IPV6: "true"

    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

    networks:
      - gateway_internal
      - stratum_dmz

    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=32m,mode=0755,exec

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    pids_limit: 200
    mem_limit: 512m
    memswap_limit: 512m

    stop_signal: SIGTERM
    stop_grace_period: 30s

    labels:
      org.opencontainers.image.authors: "Sandra Gabriela Puerto Torres <contacto@sandrapuerto.com>"
      com.sandrapuerto.architecture: "Stratum-Core"
      com.sandrapuerto.website: "https://sandrapuerto.com"
      com.stratum-core.repository: "stratum-core"
      com.stratum-core.component: "gateway"
      com.stratum-core.role: "reverse-proxy"
      com.stratum-core.revision: "1.2.0"
      com.stratum-core.slogan: "Isolation by design, not by discipline."

    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------------------
  # Primary Inbound Edge Tunnel (Host / Primary Organization)
  # --------------------------------------------------------------------------
  cloudflared-primary:
    <<: *cloudflared-base
    container_name: stratum-gateway-cloudflared-${PRIMARY_ORG_NAME:-primary}
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}

    labels:
      org.opencontainers.image.authors: "Sandra Gabriela Puerto Torres <contacto@sandrapuerto.com>"
      com.sandrapuerto.architecture: "Stratum-Core"
      com.sandrapuerto.website: "https://sandrapuerto.com"
      com.stratum-core.repository: "stratum-core"
      com.stratum-core.component: "gateway"
      com.stratum-core.role: "tunnel-${PRIMARY_ORG_NAME:-primary}"
      com.stratum-core.organization: "${PRIMARY_ORG_NAME:-primary}"
      com.stratum-core.revision: "1.2.0"
      com.stratum-core.slogan: "Isolation by design, not by discipline."

  # --------------------------------------------------------------------------
  # Secondary Inbound Edge Tunnel (Secondary / Client Organization)
  # Activated via: docker compose --profile secondary up -d (or COMPOSE_PROFILES=secondary in .env)
  # --------------------------------------------------------------------------
  cloudflared-secondary:
    <<: *cloudflared-base
    container_name: stratum-gateway-cloudflared-${SECONDARY_ORG_NAME:-secondary}
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN_SECONDARY:-${CF_TUNNEL_TOKEN_ORG_A:-}}
    profiles:
      - ${SECONDARY_ORG_NAME:-secondary}
      - secondary
      - org-a
      - multi-org
      - all

    labels:
      org.opencontainers.image.authors: "Sandra Gabriela Puerto Torres <contacto@sandrapuerto.com>"
      com.sandrapuerto.architecture: "Stratum-Core"
      com.sandrapuerto.website: "https://sandrapuerto.com"
      com.stratum-core.repository: "stratum-core"
      com.stratum-core.component: "gateway"
      com.stratum-core.role: "tunnel-${SECONDARY_ORG_NAME:-secondary}"
      com.stratum-core.organization: "${SECONDARY_ORG_NAME:-secondary}"
      com.stratum-core.revision: "1.2.0"
      com.stratum-core.slogan: "Isolation by design, not by discipline."

networks:
  gateway_internal:
    name: stratum_gateway_internal
    driver: bridge

  stratum_dmz:
    name: ${STRATUM_DMZ_NETWORK:-stratum_dmz}
    external: true

volumes:
  npm_data:
    name: stratum-gateway-npm-data
  npm_letsencrypt:
    name: stratum-gateway-npm-letsencrypt