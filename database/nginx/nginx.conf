# ============================================================================
# STRATUM-CORE — database
# Layer 4 TCP Stream Boundary Proxy Configuration
# Repository: stratum-core
# Isolation by design, not by discipline.
# ============================================================================
#
# This configuration defines a high-performance Layer 4 (TCP) stream proxy
# for the persistence engines of the Stratum data tier. It is the sole
# configuration file mounted into the boundary client container.
#
# Architectural Design Principles:
#   - No `user` directive: The container process executes as UID 101 from inception.
#   - Topology-Enforced Security: Segmentation is enforced by Docker network
#     boundaries (`database_internal`), eliminating error-prone ACLs.
#   - Dynamic DNS Resolution: Upstream service names are resolved at connection
#     time via Docker's embedded DNS (`127.0.0.11 valid=10s`) to ensure seamless
#     engine restarts and IP changes without reloading Nginx.
#   - Long-Lived Stream Persistence: `proxy_timeout` is configured for 1h to
#     support persistent database connection pools and stateful sessions.
# ============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ----------------------------------------------------------------------------
# Layer 4 TCP Stream Proxy for Persistence Engines
# ----------------------------------------------------------------------------
stream {
    # Docker Embedded DNS Resolver with fast TTL caching
    resolver 127.0.0.11 valid=10s;

    # 1. PostgreSQL Relational Wire Protocol
    server {
        listen 5432;
        set $upstream_postgres stratum-database-postgres:5432;
        proxy_pass $upstream_postgres;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }

    # 3. MongoDB Document Store Wire Protocol
    server {
        listen 27017;
        set $upstream_mongodb stratum-database-mongodb:27017;
        proxy_pass $upstream_mongodb;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }

    # 4. Redis Serialization Protocol (RESP)
    server {
        listen 6379;
        set $upstream_redis stratum-database-redis:6379;
        proxy_pass $upstream_redis;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
    }
}

# ----------------------------------------------------------------------------
# HTTP Health Probe Endpoint (Port 8080)
# ----------------------------------------------------------------------------
http {
    access_log off;

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 'ok\n';
        }

        location / {
            return 404;
        }
    }
}